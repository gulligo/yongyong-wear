<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용용아 뭐입지?</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Noto Sans KR",sans-serif;background:#f2f2f2;color:#222;min-height:100vh}
button{font-family:inherit;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:5}
header h1{font-size:18px}
.btn{background:#fff;border:1px solid #ccc;color:#222;border-radius:8px;padding:7px 12px;font-size:14px}
.main{display:flex;gap:10px;padding:10px}
.left{width:96px;flex-shrink:0;position:sticky;top:62px;align-self:flex-start;background:#fff;border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.left input{width:100%;font-size:30px;font-weight:700;text-align:center;background:#f7f7f7;color:#222;border:1px solid #ddd;border-radius:8px;padding:8px 0}
.unit{font-size:13px;color:#888;margin:4px 0 10px}
.pm{display:block;width:100%;font-size:28px;font-weight:700;padding:10px 0;margin-bottom:8px;border:none;border-radius:10px;color:#fff}
.plus{background:#c0392b}.minus{background:#2471a3}
.right{flex:1;min-width:0}
.rangeTitle{font-size:15px;color:#d35400;margin:2px 0 8px;font-weight:700}
.photo{position:relative;margin-bottom:10px}
.photo img{width:100%;border-radius:10px;display:block;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.no{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:2px 9px;font-size:13px}
.empty{color:#999;padding:40px 10px;text-align:center;line-height:1.7}
#viewer{display:none;position:fixed;inset:0;background:#000;z-index:20;align-items:center;justify-content:center}
#viewer img{max-width:100%;max-height:100%}
#settings{display:none;position:fixed;inset:0;background:#f2f2f2;z-index:10;overflow-y:auto;padding:0 0 40px}
.sec{background:#fff;margin:10px;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sec h2{font-size:15px;margin-bottom:10px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row input{width:70px;font-size:16px;padding:7px;background:#f7f7f7;color:#222;border:1px solid #ccc;border-radius:8px;text-align:center}
.rangeBox{border:1px solid #e0e0e0;border-radius:10px;padding:10px;margin-top:10px}
.rangeHead{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.rangeHead b{color:#d35400;font-size:16px}
.rangeEdit{display:flex;align-items:center;gap:4px;color:#d35400;font-weight:700}
.rangeEdit input{width:52px;font-size:16px;padding:6px 2px;background:#f7f7f7;color:#d35400;font-weight:700;border:1px solid #ccc;border-radius:8px;text-align:center}
.item{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.item img{width:60px;height:60px;object-fit:cover;border-radius:6px}
.item span{flex:1;color:#888;font-size:13px}
.item button{width:38px;height:38px;font-size:16px}
.del{background:#fdecea;border-color:#f5c6cb;color:#c0392b}
.add{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32;width:100%;margin-top:4px;padding:9px}
#splash{position:fixed;inset:0;background:#f2f2f2;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#splash img{width:180px;height:180px;border-radius:32px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
#splash div{font-size:22px;font-weight:700}
#splash.hide{opacity:0}
.rangeTop{display:flex;align-items:center;gap:10px}
.rangeThumb{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#eee;flex-shrink:0}
.cnt{margin-left:auto;color:#888;font-size:13px}
.rangeBtns{display:flex;gap:6px;margin-top:8px}
.rangeBtns .btn{flex:1;padding:8px 0;margin:0;width:auto}
.photo img{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#menu{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;align-items:flex-end;justify-content:center}
.menuBox{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:16px;text-align:center}
.menuBox img{width:120px;height:120px;object-fit:cover;border-radius:10px}
.menuBox div{margin:8px 0 12px;font-weight:700}
.menuBox button{display:block;width:100%;padding:13px;margin-bottom:8px;font-size:16px}

/* ===== 날씨 ===== */
#wx{background:#fff;margin:10px 10px 0;border-radius:12px;padding:10px 0 8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.wxTop{display:flex;justify-content:space-between;align-items:center;padding:0 10px 8px}
.tabs{display:flex;border:1px solid #2b8de0;border-radius:8px;overflow:hidden}
.tabs button{border:none;background:#fff;color:#2b8de0;font-size:14px;font-weight:700;padding:6px 14px}
.tabs button.on{background:#2b8de0;color:#fff}
.wxTime{font-size:12px;color:#999}
.wxTime b{color:#2b8de0;cursor:pointer;margin-left:6px}
#wxAlert{margin:0 10px 8px;font-size:14px;font-weight:700;border-radius:8px;padding:7px 10px}
#wxAlert.bad{background:#fdecea;color:#c0392b}
#wxAlert.good{background:#eaf4fd;color:#2b8de0}
.days{display:flex;overflow-x:auto;gap:6px;padding:0 10px 10px}
.dayc{flex:0 0 auto;min-width:118px;border:1px solid #e0e0e0;border-radius:10px;padding:6px 4px;text-align:center}
.dayc .dn{font-size:14px;font-weight:700}.dayc .dn span{color:#2b8de0;font-size:12px;margin-left:3px}
.dayc .am{display:flex;justify-content:space-around;font-size:11px;color:#888;margin-top:2px}
.dayc .ic{display:flex;justify-content:space-around;font-size:24px}
.dayc .mm{display:flex;justify-content:space-around;font-size:15px;font-weight:700}
.dayc .pp{display:flex;justify-content:space-around;font-size:12px;color:#555}
.lo{color:#2471a3}.hi{color:#c0392b}
.hwrap{display:flex}
.hlab{flex:0 0 52px;font-size:12px;color:#555;text-align:center;border-right:1px solid #eee}
.hlab div,.hcol>div{display:flex;align-items:center;justify-content:center}
.hscroll{overflow-x:auto;flex:1}
.hgrid{display:flex;position:relative}
.hcol{flex:0 0 52px;text-align:center;font-size:13px;border-right:1px dotted #e5e5e5;cursor:pointer}
.hcol.cm{background:#f3f0ff}
.hcol.bad{background:#fdecea}
.hcol.sel{outline:3px solid #2b8de0;outline-offset:-3px;border-radius:6px}
.r-date{height:22px}.r-time{height:24px}.r-ic{height:34px;font-size:22px}.r-gr{height:64px}
.r-fl{height:24px}.r-rd{height:26px}.r-pop{height:30px}.r-pcp{height:22px}.r-wd{height:30px;line-height:1.1}
.hcol .r-time{font-weight:700}
.hcol.cm .r-time{color:#6a4cd6}
.hcol .r-rd{font-weight:800;color:#6a4cd6;font-size:14px}
.hcol .r-pop{color:#2b8de0}
.hcol .r-wd{font-size:11px;color:#666;flex-direction:column}
.hcol .r-wd.strong{color:#c0392b;font-weight:800}
.hlab .r-rd{color:#6a4cd6;font-weight:800}
.hlab .r-ic{font-size:12px}
.hlab .r-date{font-size:11px;font-weight:700;color:#2b8de0}
.nc{font-size:.7em;letter-spacing:-3px}
#wxNow{display:flex;gap:8px;padding:0 10px 8px}
#wxNow .pl{flex:1;border:1px solid #e0e0e0;border-radius:10px;padding:6px 8px}
#wxNow .pl.on{border:2px solid #2b8de0}
#wxNow .nm{font-size:12px;color:#888;font-weight:700}
#wxNow .fl{font-size:26px;font-weight:800;line-height:1.2}
#wxNow .fl span{font-size:12px;color:#888;font-weight:600;margin-left:2px}
#wxNow .tp{font-size:13px;color:#555}
.hlab .r-pop{flex-direction:column;line-height:1.15}
.hlab .r-pop small{font-size:10px;color:#2b8de0}
.badge{background:#2b8de0;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;white-space:nowrap}
#hsvg{position:absolute;left:0;pointer-events:none}
.wxNote{font-size:11px;color:#999;padding:6px 10px 0;line-height:1.5}
#autoInfo{font-size:13px;color:#6a4cd6;font-weight:700;padding:8px 10px 0}
</style>
</head>
<body>

<div id="splash"><img src="icon-512.png"><div>용용아 뭐입지?</div></div>

<header>
  <h1>용용아 뭐입지?</h1>
  <button class="btn" onclick="openSettings()">⚙ 설정</button>
</header>

<div id="wx">
  <div class="wxTop">
    <div class="tabs">
      <button id="tab0" class="on" onclick="setPlace(0)">옥산</button>
      <button id="tab1" onclick="setPlace(1)">송정동</button>
    </div>
    <div class="wxTime"><span id="wxAt">불러오는 중...</span><b onclick="loadWx(true)">↻</b></div>
  </div>
  <div id="wxNow"></div>
  <div id="wxAlert"></div>
  <div class="days" id="days"></div>
  <div class="hwrap">
    <div class="hlab">
      <div class="r-date" id="curDate"></div>
      <div class="r-time">시각</div>
      <div class="r-ic">날씨</div>
      <div class="r-gr">기온</div>
      <div class="r-fl">체감</div>
      <div class="r-pop" id="popLab">강수확률</div>
      <div class="r-pcp">강수량</div>
      <div class="r-wd">바람</div>
    </div>
    <div class="hscroll" id="hscroll"><div class="hgrid" id="hgrid"></div></div>
  </div>
  <div class="wxNote">시간을 누르면 그 시간 체감온도로 옷이 바뀝니다 · 보라 = 출퇴근 · 빨강 = 비·눈·강풍</div>
  <div id="autoInfo"></div>
</div>

<div class="main">
  <div class="left">
    <input type="number" id="temp" inputmode="decimal">
    <div class="unit">℃</div>
    <button class="pm plus" onclick="step(1)">＋</button>
    <button class="pm minus" onclick="step(-1)">−</button>
  </div>
  <div class="right" id="photos"></div>
</div>

<div id="menu" onclick="if(event.target===this)closeMenu()">
  <div class="menuBox">
    <img id="menuImg"><div id="menuTitle"></div>
    <button class="btn" onclick="menuMove(-1)">↑ 앞으로</button>
    <button class="btn" onclick="menuMove(1)">↓ 뒤로</button>
    <button class="btn del" onclick="menuDel()">삭제</button>
    <button class="btn" onclick="closeMenu()">닫기</button>
  </div>
</div>

<div id="viewer" onclick="this.style.display='none'"><img id="viewImg"></div>

<div id="settings">
  <header>
    <h1>⚙ 설정</h1>
    <button class="btn" onclick="closeSettings()">완료</button>
  </header>

  <div class="sec">
    <h2>온도 구간 추가</h2>
    <div class="row">
      <input type="number" id="newMin" inputmode="decimal"> ~
      <input type="number" id="newMax" inputmode="decimal"> ℃
      <button class="btn" onclick="addRange()">추가</button>
    </div>
    <div id="rangeList"></div>
  </div>

  <div class="sec">
    <h2>백업</h2>
    <div class="row">
      <button class="btn" onclick="exportData()">백업 파일 저장</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">백업 불러오기</button>
    </div>
  </div>
</div>

<input type="file" id="photoFile" accept="image/*" multiple style="display:none">
<input type="file" id="importFile" accept=".json" style="display:none">

<script>
let db, data = { ranges: [] };
let addTarget = null;
const tIn = document.getElementById('temp');

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('bikeClothes', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('s');
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
function load() {
  return new Promise(res => {
    const r = db.transaction('s').objectStore('s').get('data');
    r.onsuccess = () => { if (r.result) data = r.result; res(); };
    r.onerror = () => res();
  });
}
function save() {
  return new Promise(res => {
    const t = db.transaction('s', 'readwrite');
    t.objectStore('s').put(data, 'data');
    t.oncomplete = res;
    t.onerror = () => { alert('저장 실패 (저장공간 부족일 수 있습니다)'); res(); };
  });
}

// 사진 줄이기 (용량 절약)
function resize(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const m = 1000;
      let w = img.width, h = img.height;
      if (w > m || h > m) { const s = m / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = rej;
    img.src = url;
  });
}

// ===== 메인 화면 =====
function step(d) {
  const v = parseFloat(tIn.value);
  tIn.value = (isNaN(v) ? 10 : v) + d;
  show();
}
tIn.addEventListener('input', show);

function show() {
  const box = document.getElementById('photos');
  const t = parseFloat(tIn.value);
  box.innerHTML = '';
  if (isNaN(t)) { box.innerHTML = '<div class="empty">온도를 입력하세요</div>'; return; }
  try { localStorage.setItem('lastTemp', t); } catch (e) {}
  const hits = data.ranges.filter(r => t >= r.min && t <= r.max).sort((a, b) => (b.max - a.max) || (b.min - a.min));
  if (!hits.length) {
    box.innerHTML = `<div class="empty">${t}℃ 에 맞는 구간이 없습니다.<br>⚙ 설정에서 구간을 추가하세요.</div>`;
    return;
  }
  hits.forEach(r => {
    const title = document.createElement('div');
    title.className = 'rangeTitle';
    title.textContent = `${r.min} ~ ${r.max}℃`;
    box.appendChild(title);
    if (!r.photos.length) {
      const e = document.createElement('div');
      e.className = 'empty'; e.textContent = '등록된 사진이 없습니다';
      box.appendChild(e);
    }
    r.photos.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'photo';
      d.innerHTML = `<img src="${p.src}"><div class="no">${i + 1}</div>`;
      let timer = null, longFired = false, sx = 0, sy = 0;
      const cancel = () => { clearTimeout(timer); timer = null; };
      d.addEventListener('pointerdown', e => {
        longFired = false; sx = e.clientX; sy = e.clientY;
        timer = setTimeout(() => { longFired = true; openMenu(r.id, i); }, 550);
      });
      d.addEventListener('pointermove', e => { if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) cancel(); });
      d.addEventListener('pointerup', cancel);
      d.addEventListener('pointercancel', cancel);
      d.addEventListener('contextmenu', e => e.preventDefault());
      d.onclick = () => {
        if (longFired) return;
        document.getElementById('viewImg').src = p.src;
        document.getElementById('viewer').style.display = 'flex';
      };
      box.appendChild(d);
    });
  });
}

// ===== 사진 길게 누르기 메뉴 =====
let menuR = null, menuI = 0;
function openMenu(id, i) { menuR = id; menuI = i; drawMenu(); document.getElementById('menu').style.display = 'flex'; }
function drawMenu() {
  const ph = findRange(menuR).photos;
  document.getElementById('menuImg').src = ph[menuI].src;
  document.getElementById('menuTitle').textContent = `${menuI + 1}번 / ${ph.length}장`;
}
function closeMenu() { document.getElementById('menu').style.display = 'none'; }
async function menuMove(d) {
  const ph = findRange(menuR).photos, j = menuI + d;
  if (j < 0 || j >= ph.length) return;
  [ph[menuI], ph[j]] = [ph[j], ph[menuI]];
  menuI = j;
  await save(); show(); drawMenu();
}
async function menuDel() {
  if (!confirm('이 사진을 삭제할까요?')) return;
  findRange(menuR).photos.splice(menuI, 1);
  await save(); closeMenu(); show();
}

// ===== 설정 =====
function openSettings() {
  renderSettings();
  document.getElementById('settings').style.display = 'block';
}
function closeSettings() {
  document.getElementById('settings').style.display = 'none';
  show();
}
async function addRange() {
  const mn = parseFloat(document.getElementById('newMin').value);
  const mx = parseFloat(document.getElementById('newMax').value);
  if (isNaN(mn) || isNaN(mx)) return alert('두 온도를 모두 입력하세요');
  const lo = Math.min(mn, mx), hi = Math.max(mn, mx);
  if (data.ranges.some(r => r.min === lo && r.max === hi)) return alert(`${lo} ~ ${hi}℃ 구간은 이미 있습니다`);
  const id = Date.now();
  data.ranges.push({ id, min: lo, max: hi, photos: [] });
  sortRanges();
  await save();
  document.getElementById('newMin').value = '';
  document.getElementById('newMax').value = '';
  renderSettings();
}
// 높은 온도 구간이 위로
function sortRanges() { data.ranges.sort((a, b) => (b.max - a.max) || (b.min - a.min)); }
function findRange(id) { return data.ranges.find(r => r.id === id); }

async function editRange(id) {
  const mn = parseFloat(document.getElementById('min' + id).value);
  const mx = parseFloat(document.getElementById('max' + id).value);
  if (isNaN(mn) || isNaN(mx)) return alert('두 온도를 모두 입력하세요');
  const r = findRange(id);
  r.min = Math.min(mn, mx); r.max = Math.max(mn, mx);
  sortRanges();
  await save(); renderSettings();
  alert(`${r.min} ~ ${r.max}℃ 로 변경됨`);
}
async function delRange(id) {
  const r = findRange(id);
  if (!confirm(`${r.min} ~ ${r.max}℃ 구간과 사진을 모두 삭제할까요?`)) return;
  data.ranges = data.ranges.filter(x => x.id !== id);
  await save(); renderSettings();
}
function pickPhotos(id) {
  addTarget = id;
  document.getElementById('photoFile').click();
}
document.getElementById('photoFile').addEventListener('change', async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length || addTarget === null) return;
  const r = findRange(addTarget);
  for (const f of files) {
    try { r.photos.push({ src: await resize(f) }); } catch (err) { alert('사진을 읽지 못했습니다'); }
  }
  await save(); renderSettings();
});

function renderSettings() {
  const list = document.getElementById('rangeList');
  list.innerHTML = '';
  data.ranges.forEach(r => {
    const box = document.createElement('div');
    box.className = 'rangeBox';
    const thumb = r.photos.length ? `<img class="rangeThumb" src="${r.photos[0].src}">` : `<div class="rangeThumb"></div>`;
    box.innerHTML = `<div class="rangeTop">${thumb}
      <span class="rangeEdit"><input type="number" inputmode="decimal" id="min${r.id}" value="${r.min}"> ~
      <input type="number" inputmode="decimal" id="max${r.id}" value="${r.max}"> ℃</span>
      <span class="cnt">${r.photos.length}장</span></div>
      <div class="rangeBtns">
        <button class="btn" onclick="editRange(${r.id})">변경</button>
        <button class="btn del" onclick="delRange(${r.id})">삭제</button>
        <button class="btn add" onclick="pickPhotos(${r.id})">＋사진</button>
      </div>`;
    list.appendChild(box);
  });
}

// ===== 백업 =====
function exportData() {
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '자전거옷_백업.json';
  a.click();
}
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.ranges) throw 0;
    if (!confirm('현재 데이터를 백업 파일로 바꿀까요?')) return;
    data = d;
    await save();
    renderSettings();
    alert('불러오기 완료');
  } catch { alert('올바른 백업 파일이 아닙니다'); }
});

// ===== 날씨 (기상청 단기예보) =====
const WX_KEY = '%2BEh8kbFd9hpLu1HNrPktRwJmihJIlWkCQ0YQ3JTiiaQrPCUydm4o8AR71ASjakiseukq%2BjGF0UJufZm89REMeQ%3D%3D';
const PLACES = [{ name: '옥산', nx: 67, ny: 107 }, { name: '송정동', nx: 68, ny: 107 }];
const COMMUTE = [6, 14, 18, 22];   // 출퇴근 시각
const RIDE_KMH = 20;               // 자전거 평소 속도
const WIND_WARN = 7;               // 강풍 경고 (m/s)
const POP_WARN = 60;               // 비 경고 (%)
const COL_W = 52;

let WX = null, place = 0, selKey = null;
const pad2 = n => String(n).padStart(2, '0');
const ymd8 = d => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;

async function wxApi(op, b, p) {
  const url = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/${op}?serviceKey=${WX_KEY}`
    + `&pageNo=1&numOfRows=1000&dataType=JSON&base_date=${b.date}&base_time=${b.time}&nx=${p.nx}&ny=${p.ny}`;
  const j = JSON.parse(await (await fetch(url)).text());
  const it = j.response && j.response.body && j.response.body.items && j.response.body.items.item;
  if (!it) throw new Error(op);
  return it;
}
// 현재 날씨(초단기실황): 매시 정각 자료, 40분 이후 제공
function baseNow() { const d = new Date(Date.now() - 40 * 60000); return { date: ymd8(d), time: pad2(d.getHours()) + '00' }; }
function baseUltra() { const d = new Date(Date.now() - 45 * 60000); return { date: ymd8(d), time: pad2(d.getHours()) + '30' }; }
function baseVil() {
  const d = new Date(Date.now() - 10 * 60000);
  let h = [2, 5, 8, 11, 14, 17, 20, 23].filter(x => x <= d.getHours()).pop();
  if (h === undefined) { d.setDate(d.getDate() - 1); h = 23; }
  return { date: ymd8(d), time: pad2(h) + '00' };
}
// 오늘 최저·최고가 들어있는 예보: 오늘 새벽 2시 발표 (2시 10분 전이면 어제 23시)
function baseDay() {
  const d = new Date(Date.now() - 10 * 60000);
  if (d.getHours() >= 2) return { date: ymd8(d), time: '0200' };
  d.setDate(d.getDate() - 1);
  return { date: ymd8(d), time: '2300' };
}

async function loadPlace(p) {
  const out = { h: {}, tmx: {}, tmn: {}, popAt: null, now: null, nowAt: null };
  const add = (items, ren) => items.forEach(i => {
    const k = i.fcstDate + i.fcstTime;
    (out.h[k] = out.h[k] || {})[ren[i.category] || i.category] = i.fcstValue;
    if (i.category === 'TMX') out.tmx[i.fcstDate] = +i.fcstValue;
    if (i.category === 'TMN') out.tmn[i.fcstDate] = +i.fcstValue;
  });
  const [a, b, c, n] = await Promise.allSettled([
    wxApi('getVilageFcst', baseDay(), p),
    wxApi('getVilageFcst', baseVil(), p),
    wxApi('getUltraSrtFcst', baseUltra(), p),
    wxApi('getUltraSrtNcst', baseNow(), p)
  ]);
  if (n.status === 'fulfilled') {
    out.now = {};
    n.value.forEach(i => out.now[i.category] = +i.obsrValue);
    out.nowAt = baseNow().time;
  }
  if (a.status === 'fulfilled') { add(a.value, {}); out.popAt = baseDay().time; }
  if (b.status === 'fulfilled') { add(b.value, {}); out.popAt = baseVil().time; }
  if (c.status === 'fulfilled') add(c.value, { T1H: 'TMP', RN1: 'PCP' });
  if (b.status !== 'fulfilled' && c.status !== 'fulfilled') throw new Error('fail');
  return out;
}

// 체감온도 (기상청 공식)
function chill(t, kmh) {
  if (t > 10 || kmh < 4.68) return t;
  const v = Math.pow(kmh, 0.16);
  return 13.12 + 0.6215 * t - 11.37 * v + 0.3965 * t * v;
}
function summer(t, rh) {
  const tw = t * Math.atan(0.151977 * Math.sqrt(rh + 8.313659)) + Math.atan(t + rh) - Math.atan(rh - 1.67633)
    + 0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh) - 4.686035;
  return -0.2442 + 0.55399 * tw + 0.45535 * t - 0.0022 * tw * tw + 0.00278 * tw * t + 3.0;
}
function feel(t, w, rh, mon) { return (mon >= 5 && mon <= 9 && t >= 20 && !isNaN(rh)) ? summer(t, rh) : chill(t, w * 3.6); }
function ride(t, w) { return chill(t, w * 3.6 + RIDE_KMH); }

const SKY = { 1: '☀️', 3: '⛅', 4: '☁️' };
const PTY = { 1: '🌧️', 2: '🌨️', 3: '❄️', 4: '🌦️', 5: '🌧️', 6: '🌨️', 7: '❄️' };
const PTYT = { 1: '비', 2: '비/눈', 3: '눈', 4: '소나기', 5: '빗방울', 6: '진눈깨비', 7: '눈날림' };
function wIcon(v, h) {
  if (+v.PTY > 0) return PTY[v.PTY] || '🌧️';
  if (+v.SKY === 1 && (h < 6 || h >= 19)) return '🌙';
  if (+v.SKY === 3 && (h < 6 || h >= 19)) return '<span class="nc">🌙☁️</span>';
  return SKY[v.SKY] || '';
}
// 가장 많이 나온 값 (같으면 더 흐린 쪽)
function mode(arr) {
  const c = {};
  arr.forEach(x => c[x] = (c[x] || 0) + 1);
  return +Object.keys(c).sort((a, b) => (c[b] - c[a]) || (b - a))[0];
}
function dirTx(d) { return ['북', '북동', '동', '남동', '남', '남서', '서', '북서'][Math.round(d / 45) % 8]; }
function pcpTx(v) { if (!v || v === '강수없음' || v === '0') return '-'; return String(v).replace('mm', ''); }

async function loadWx(force) {
  if (!force) {
    try {
      const c = JSON.parse(localStorage.getItem('wearWx') || 'null');
      if (c) { WX = c.d; renderWx(new Date(c.at), !selKey); }
      if (c && Date.now() - c.at < 10 * 60000) return;
    } catch (e) {}
  }
  document.getElementById('wxAt').textContent = '불러오는 중...';
  try {
    WX = await Promise.all(PLACES.map(loadPlace));
    try { localStorage.setItem('wearWx', JSON.stringify({ at: Date.now(), d: WX })); } catch (e) {}
    renderWx(new Date(), !selKey);
  } catch (e) {
    document.getElementById('wxAt').textContent = '날씨를 불러오지 못했습니다';
  }
}

function setPlace(i) {
  place = i;
  document.getElementById('tab0').classList.toggle('on', i === 0);
  document.getElementById('tab1').classList.toggle('on', i === 1);
  renderWx(null, false);
}

function hourList() {
  const now = new Date();
  const cur = ymd8(now) + pad2(now.getHours()) + '00';
  return [...new Set(WX.flatMap(w => Object.keys(w.h)))]
    .filter(k => k >= cur && WX.every(w => w.h[k] && w.h[k].TMP != null))
    .sort();
}
function info(k) {
  const vs = WX.map(w => w.h[k]);
  const mon = +k.substr(4, 2);
  return vs.map(v => {
    const t = +v.TMP, w = +v.WSD || 0, rh = +v.REH;
    return { v, t, w, rh, feel: feel(t, w, rh, mon), ride: ride(t, w), pop: v.POP != null ? +v.POP : null, pty: +v.PTY || 0 };
  });
}
const isBad = x => x.pty > 0 || (x.pop != null && x.pop >= POP_WARN) || x.w >= WIND_WARN;
const shiftK = (k, d) => {
  const t = new Date(+k.substr(0, 4), +k.substr(4, 2) - 1, +k.substr(6, 2), +k.substr(8, 2) + d);
  return ymd8(t) + pad2(t.getHours()) + '00';
};

function renderWx(at, autoPick) {
  if (!WX) return;
  if (at) document.getElementById('wxAt').textContent = `${pad2(at.getHours())}:${pad2(at.getMinutes())} 기상청`;
  const now = new Date();
  const dayName = d8 => {
    const dd = new Date(+d8.substr(0, 4), +d8.substr(4, 2) - 1, +d8.substr(6, 2));
    const diff = Math.round((dd - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    return { lab: ['오늘', '내일', '모레', '글피'][diff] || '', txt: `${dd.getDate()}일(${'일월화수목금토'[dd.getDay()]})` };
  };
  const W = WX[place];
  // --- 지금 날씨 (두 곳) ---
  document.getElementById('wxNow').innerHTML = WX.map((w, i) => {
    const n = w.now;
    if (!n || n.T1H == null) return `<div class="pl ${i === place ? 'on' : ''}"><div class="nm">${PLACES[i].name} 지금</div><div class="tp">자료 없음</div></div>`;
    const f = feel(n.T1H, n.WSD || 0, n.REH, now.getMonth() + 1);
    const rain = n.PTY > 0 ? ` · ${PTYT[n.PTY]}${n.RN1 ? ' ' + n.RN1 + 'mm' : ''}` : '';
    return `<div class="pl ${i === place ? 'on' : ''}" onclick="setPlace(${i})">
      <div class="nm">${PLACES[i].name} 지금 (${+w.nowAt.substr(0, 2)}시)</div>
      <div class="fl">${f.toFixed(1)}°<span>체감</span></div>
      <div class="tp">기온 ${n.T1H.toFixed(1)}° · 바람 ${n.WSD}m/s${rain}</div></div>`;
  }).join('');
  document.getElementById('popLab').innerHTML = W.popAt ? `강수확률<small>${+W.popAt.substr(0, 2)}시 발표</small>` : '강수확률';
  const keys = hourList();
  const infos = {}; keys.forEach(k => infos[k] = info(k));

  // --- 날짜별 요약 (오전/오후) ---
  const dates = [...new Set(Object.keys(W.h).map(k => k.substr(0, 8)))].sort().filter(d => d >= ymd8(now)).slice(0, 3);
  document.getElementById('days').innerHTML = dates.map(d => {
    const hs = Object.keys(W.h).filter(k => k.startsWith(d) && W.h[k].TMP != null);
    // 오전(0~11시)/오후(12~23시): 날씨누리처럼 지난 시간은 빼고,
    // 하늘은 가장 많이 나온 상태, 강수확률은 평균을 10% 단위로 반올림
    const cur = ymd8(now) + pad2(now.getHours()) + '00';
    const half = am => {
      const ks = hs.filter(k => (am ? +k.substr(8, 2) < 12 : +k.substr(8, 2) >= 12) && k >= cur);
      if (!ks.length) return { ic: '-', pop: '-' };
      const rain = ks.map(k => +W.h[k].PTY || 0).filter(x => x > 0);
      let v;
      if (rain.length) v = { PTY: mode(rain) };
      else v = { PTY: 0, SKY: mode(ks.map(k => +W.h[k].SKY).filter(x => !isNaN(x))) };
      const pops = ks.map(k => +W.h[k].POP).filter(x => !isNaN(x));
      const avg = pops.length ? Math.round(pops.reduce((a, b) => a + b, 0) / pops.length / 10) * 10 : null;
      return { ic: wIcon(v, am ? 9 : 15), pop: avg == null ? '-' : avg + '%' };
    };
    const temps = hs.map(k => +W.h[k].TMP);
    const lo = W.tmn[d] != null ? W.tmn[d] : temps.length ? Math.min(...temps) : null;
    const hi = W.tmx[d] != null ? W.tmx[d] : temps.length ? Math.max(...temps) : null;
    const a = half(true), p = half(false), n = dayName(d);
    return `<div class="dayc"><div class="dn">${n.txt}<span>${n.lab}</span></div>
      <div class="am"><span>오전</span><span>오후</span></div>
      <div class="ic"><span>${a.ic}</span><span>${p.ic}</span></div>
      <div class="mm"><span class="lo">${lo == null ? '-' : Math.round(lo) + '°'}</span><span class="hi">${hi == null ? '-' : Math.round(hi) + '°'}</span></div>
      <div class="pp"><span>${a.pop}</span><span>${p.pop}</span></div></div>`;
  }).join('');

  // --- 출퇴근 경고 (두 곳 모두, 앞뒤 1시간) ---
  const badC = {}, alerts = [];
  keys.filter(k => COMMUTE.includes(+k.substr(8, 2))).forEach(k => {
    const around = [-1, 0, 1].map(d => infos[shiftK(k, d)]).filter(Boolean).flat();
    if (!around.some(isBad)) return;
    badC[k] = true;
    const what = [];
    const pty = around.map(x => x.pty).find(x => x > 0);
    const pop = Math.max(...around.map(x => x.pop || 0));
    if (pty) what.push(PTYT[pty]); else if (pop >= POP_WARN) what.push(`비 ${pop}%`);
    const w = Math.max(...around.map(x => x.w));
    if (w >= WIND_WARN) what.push(`바람 ${w}m/s`);
    alerts.push(`${dayName(k.substr(0, 8)).lab} ${+k.substr(8, 2)}시 ${what.join(', ')}`);
  });
  const al = document.getElementById('wxAlert');
  al.className = alerts.length ? 'bad' : 'good';
  al.textContent = alerts.length ? '⚠️ ' + alerts.slice(0, 3).join(' · ') : '👍 모레까지 출퇴근 시간 비·강풍 없음';

  // --- 시간별 ---
  let lastD = '';
  const grid = document.getElementById('hgrid');
  grid.innerHTML = keys.map(k => {
    const x = infos[k][place], hr = +k.substr(8, 2), d = k.substr(0, 8);
    const date = d !== lastD ? `<span class="badge">${dayName(d).txt}</span>` : '';
    lastD = d;
    const cm = COMMUTE.includes(hr);
    const cls = [cm ? 'cm' : '', (cm && badC[k]) || isBad(x) ? 'bad' : '', k === selKey ? 'sel' : ''].join(' ');
    const vec = +x.v.VEC;
    return `<div class="hcol ${cls}" data-k="${k}" onclick="pickHour('${k}')">
      <div class="r-date">${date}</div>
      <div class="r-time">${hr}시</div>
      <div class="r-ic">${wIcon(x.v, hr)}</div>
      <div class="r-gr"></div>
      <div class="r-fl">${Math.round(x.feel)}°</div>
      <div class="r-pop">${x.pop == null ? '' : x.pop + '%'}</div>
      <div class="r-pcp">${pcpTx(x.v.PCP)}</div>
      <div class="r-wd ${x.w >= WIND_WARN ? 'strong' : ''}"><span>${isNaN(vec) ? '' : dirTx(vec)}</span><span>${x.w}m/s</span></div>
    </div>`;
  }).join('');

  // --- 기온 꺾은선 그래프 ---
  const temps = keys.map(k => infos[k][place].t);
  if (temps.length) {
    const mx = Math.max(...temps), mn = Math.min(...temps), span = Math.max(mx - mn, 1);
    const top = 22 + 24 + 34, H = 64;
    const pts = temps.map((t, i) => [i * COL_W + COL_W / 2, top + 18 + (mx - t) / span * (H - 26)]);
    const svg = `<svg id="hsvg" width="${keys.length * COL_W}" height="${top + H}" style="top:0">
      <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#2b8de0" stroke-width="2.5"/>
      ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#2b8de0"/>
        <text x="${p[0]}" y="${p[1] - 8}" text-anchor="middle" font-size="13" fill="#222">${Math.round(temps[i])}°</text>`).join('')}
    </svg>`;
    grid.insertAdjacentHTML('beforeend', svg);
  }

  // --- 처음엔 다음 출퇴근 시간 자동 선택 (두 곳 중 더 추운 쪽) ---
  if (autoPick || !selKey || !infos[selKey]) {
    const next = keys.find(k => COMMUTE.includes(+k.substr(8, 2)) && k > keys[0]) || keys[0];
    if (next) pickHour(next, true);
  } else {
    showAuto(selKey, false);
  }
}

function pickHour(k, auto) {
  selKey = k;
  document.querySelectorAll('.hcol').forEach(c => c.classList.toggle('sel', c.dataset.k === k));
  showAuto(k, auto);
  if (auto) {
    const col = document.querySelector(`.hcol[data-k="${k}"]`);
    if (col) document.getElementById('hscroll').scrollLeft = Math.max(0, col.offsetLeft - COL_W * 2);
  }
  updCurDate();
}
function showAuto(k, colder) {
  const xs = info(k);
  let i = place;
  if (colder) i = xs[0].feel <= xs[1].feel ? 0 : 1;
  const t = Math.round(xs[i].feel);
  const d = new Date(+k.substr(0, 4), +k.substr(4, 2) - 1, +k.substr(6, 2));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const lab = ['오늘', '내일', '모레'][Math.round((d - today) / 86400000)] || '';
  document.getElementById('autoInfo').textContent =
    `👕 ${lab} ${+k.substr(8, 2)}시 ${PLACES[i].name} 체감 ${t}° 기준${colder ? ' (두 곳 중 더 추운 쪽)' : ''}`;
  tIn.value = t;
  show();
}

// ===== 시작 =====
(async () => {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  await openDB();
  await load();
  sortRanges();
  let last = null;
  try { last = localStorage.getItem('lastTemp'); } catch (e) {}
  tIn.value = (last !== null && last !== '') ? last : 10;
  show();
  loadWx(false);
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadWx(false); });
// 앱을 켜둔 상태에서도 10분마다 새로 받아오기
setInterval(() => { if (!document.hidden) loadWx(true); }, 10 * 60000);
// 옆으로 넘길 때 왼쪽에 지금 보이는 날짜 표시
function updCurDate() {
  const cols = document.querySelectorAll('.hcol');
  const c = cols[Math.min(cols.length - 1, Math.floor(document.getElementById('hscroll').scrollLeft / COL_W))];
  if (!c) return;
  const k = c.dataset.k;
  document.getElementById('curDate').textContent = `${+k.substr(6, 2)}일`;
}
document.getElementById('hscroll').addEventListener('scroll', updCurDate);

// 시작 화면 1.5초 후 사라짐
setTimeout(() => {
  const sp = document.getElementById('splash');
  sp.classList.add('hide');
  setTimeout(() => sp.remove(), 500);
}, 1500);
</script>
