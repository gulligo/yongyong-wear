<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용용아 뭐입지?</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Noto Sans KR",sans-serif;background:#f2f2f2;color:#222;min-height:100vh}
button{font-family:inherit;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:5}
header h1{font-size:18px}
.btn{background:#fff;border:1px solid #ccc;color:#222;border-radius:8px;padding:7px 12px;font-size:14px}
.main{display:flex;gap:10px;padding:10px}
.left{width:96px;flex-shrink:0;position:sticky;top:62px;align-self:flex-start;background:#fff;border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.left input{width:100%;font-size:30px;font-weight:700;text-align:center;background:#f7f7f7;color:#222;border:1px solid #ddd;border-radius:8px;padding:8px 0}
.unit{font-size:13px;color:#888;margin:4px 0 10px}
.pm{display:block;width:100%;font-size:28px;font-weight:700;padding:10px 0;margin-bottom:8px;border:none;border-radius:10px;color:#fff}
.plus{background:#c0392b}.minus{background:#2471a3}
.right{flex:1;min-width:0}
.rangeTitle{font-size:15px;color:#d35400;margin:2px 0 8px;font-weight:700}
.photo{position:relative;margin-bottom:10px}
.photo img{width:100%;border-radius:10px;display:block;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.no{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:2px 9px;font-size:13px}
.empty{color:#999;padding:40px 10px;text-align:center;line-height:1.7}
#viewer{display:none;position:fixed;inset:0;background:#000;z-index:20;align-items:center;justify-content:center}
#viewer img{max-width:100%;max-height:100%}
#settings{display:none;position:fixed;inset:0;background:#f2f2f2;z-index:10;overflow-y:auto;padding:0 0 40px}
.sec{background:#fff;margin:10px;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sec h2{font-size:15px;margin-bottom:10px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row input{width:70px;font-size:16px;padding:7px;background:#f7f7f7;color:#222;border:1px solid #ccc;border-radius:8px;text-align:center}
.rangeBox{border:1px solid #e0e0e0;border-radius:10px;padding:10px;margin-top:10px}
.rangeTitleRow{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:4px 2px}
.rangeTitleRow b{color:#d35400;font-size:17px;flex:1;margin-left:10px}
.rangeThumb{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#eee;flex-shrink:0}
.rangeTitleRow span{color:#888;font-size:13px}
.rangeHead{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.rangeHead b{color:#d35400;font-size:16px}
.rangeEdit{display:flex;align-items:center;gap:4px;color:#d35400;font-weight:700}
.rangeEdit input{width:52px;font-size:16px;padding:6px 2px;background:#f7f7f7;color:#d35400;font-weight:700;border:1px solid #ccc;border-radius:8px;text-align:center}
.item{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.item img{width:60px;height:60px;object-fit:cover;border-radius:6px}
.item span{flex:1;color:#888;font-size:13px}
.item button{width:38px;height:38px;font-size:16px}
.del{background:#fdecea;border-color:#f5c6cb;color:#c0392b}
.add{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32;width:100%;margin-top:4px;padding:9px}
#splash{position:fixed;inset:0;background:#f2f2f2;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#splash img{width:180px;height:180px;border-radius:32px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
#splash div{font-size:22px;font-weight:700}
#splash.hide{opacity:0}
.weather{display:flex;gap:8px;padding:10px 10px 0}
.wbox{flex:1;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.wbox b{display:block;margin-bottom:6px;color:#555;font-size:14px}
.wrow{margin-bottom:6px}
.chip{display:inline-block;padding:4px 10px;border-radius:14px;background:#f2f2f2;font-weight:700;font-size:15px;cursor:pointer}
.chip.hi{color:#c0392b}.chip.lo{color:#2471a3}
.feel{display:inline-block;margin-top:3px;font-size:13px;color:#777;cursor:pointer;padding:2px 4px}
.wmsg{flex:1;color:#888;font-size:13px;padding:6px 2px}
</style>
</head>
<body>

<div id="splash"><img src="icon-512.png"><div>용용아 뭐입지?</div></div>

<header>
  <h1>용용아 뭐입지?</h1>
  <button class="btn" onclick="openSettings()">⚙ 설정</button>
</header>

<div class="weather" id="weather"><div class="wmsg">위치 확인 중…</div></div>

<div class="main">
  <div class="left">
    <input type="number" id="temp" inputmode="decimal">
    <div class="unit">℃</div>
    <button class="pm plus" onclick="step(1)">＋</button>
    <button class="pm minus" onclick="step(-1)">−</button>
  </div>
  <div class="right" id="photos"></div>
</div>

<div id="viewer" onclick="this.style.display='none'"><img id="viewImg"></div>

<div id="settings">
  <header>
    <h1>⚙ 설정</h1>
    <button class="btn" onclick="closeSettings()">완료</button>
  </header>

  <div class="sec">
    <h2>온도 구간 추가</h2>
    <div class="row">
      <input type="number" id="newMin" inputmode="decimal"> ~
      <input type="number" id="newMax" inputmode="decimal"> ℃
      <button class="btn" onclick="addRange()">추가</button>
    </div>
    <div id="rangeList"></div>
  </div>

  <div class="sec">
    <h2>백업</h2>
    <div class="row">
      <button class="btn" onclick="exportData()">백업 파일 저장</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">백업 불러오기</button>
    </div>
  </div>
</div>

<input type="file" id="photoFile" accept="image/*" multiple style="display:none">
<input type="file" id="importFile" accept=".json" style="display:none">

<script>
let db, data = { ranges: [] };
let addTarget = null;
const tIn = document.getElementById('temp');

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('bikeClothes', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('s');
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
function load() {
  return new Promise(res => {
    const r = db.transaction('s').objectStore('s').get('data');
    r.onsuccess = () => { if (r.result) data = r.result; res(); };
    r.onerror = () => res();
  });
}
function save() {
  return new Promise(res => {
    const t = db.transaction('s', 'readwrite');
    t.objectStore('s').put(data, 'data');
    t.oncomplete = res;
    t.onerror = () => { alert('저장 실패 (저장공간 부족일 수 있습니다)'); res(); };
  });
}

// 사진 줄이기 (용량 절약)
function resize(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const m = 1000;
      let w = img.width, h = img.height;
      if (w > m || h > m) { const s = m / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = rej;
    img.src = url;
  });
}

// ===== 메인 화면 =====
function step(d) {
  const v = parseFloat(tIn.value);
  tIn.value = (isNaN(v) ? 10 : v) + d;
  show();
}
tIn.addEventListener('input', show);

function show() {
  const box = document.getElementById('photos');
  const t = parseFloat(tIn.value);
  box.innerHTML = '';
  if (isNaN(t)) { box.innerHTML = '<div class="empty">온도를 입력하세요</div>'; return; }
  try { localStorage.setItem('lastTemp', t); } catch (e) {}
  const hits = data.ranges.filter(r => t >= r.min && t <= r.max).sort((a, b) => (b.max - a.max) || (b.min - a.min));
  if (!hits.length) {
    box.innerHTML = `<div class="empty">${t}℃ 에 맞는 구간이 없습니다.<br>⚙ 설정에서 구간을 추가하세요.</div>`;
    return;
  }
  hits.forEach(r => {
    const title = document.createElement('div');
    title.className = 'rangeTitle';
    title.textContent = `${r.min} ~ ${r.max}℃`;
    box.appendChild(title);
    if (!r.photos.length) {
      const e = document.createElement('div');
      e.className = 'empty'; e.textContent = '등록된 사진이 없습니다';
      box.appendChild(e);
    }
    r.photos.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'photo';
      d.innerHTML = `<img src="${p.src}"><div class="no">${i + 1}</div>`;
      d.onclick = () => {
        document.getElementById('viewImg').src = p.src;
        document.getElementById('viewer').style.display = 'flex';
      };
      box.appendChild(d);
    });
  });
}

// ===== 설정 =====
function openSettings() {
  renderSettings();
  document.getElementById('settings').style.display = 'block';
}
function closeSettings() {
  document.getElementById('settings').style.display = 'none';
  show();
}
async function addRange() {
  const mn = parseFloat(document.getElementById('newMin').value);
  const mx = parseFloat(document.getElementById('newMax').value);
  if (isNaN(mn) || isNaN(mx)) return alert('두 온도를 모두 입력하세요');
  const lo = Math.min(mn, mx), hi = Math.max(mn, mx);
  if (data.ranges.some(r => r.min === lo && r.max === hi)) return alert(`${lo} ~ ${hi}℃ 구간은 이미 있습니다`);
  const id = Date.now();
  data.ranges.push({ id, min: lo, max: hi, photos: [] });
  openId = id;
  sortRanges();
  await save();
  document.getElementById('newMin').value = '';
  document.getElementById('newMax').value = '';
  renderSettings();
}
// 높은 온도 구간이 위로
function sortRanges() { data.ranges.sort((a, b) => (b.max - a.max) || (b.min - a.min)); }
function findRange(id) { return data.ranges.find(r => r.id === id); }

async function editRange(id) {
  const mn = parseFloat(document.getElementById('min' + id).value);
  const mx = parseFloat(document.getElementById('max' + id).value);
  if (isNaN(mn) || isNaN(mx)) return alert('두 온도를 모두 입력하세요');
  const r = findRange(id);
  r.min = Math.min(mn, mx); r.max = Math.max(mn, mx);
  sortRanges();
  await save(); renderSettings();
  alert(`${r.min} ~ ${r.max}℃ 로 변경됨`);
}
async function delRange(id) {
  const r = findRange(id);
  if (!confirm(`${r.min} ~ ${r.max}℃ 구간과 사진을 모두 삭제할까요?`)) return;
  data.ranges = data.ranges.filter(x => x.id !== id);
  await save(); renderSettings();
}
async function movePhoto(id, i, d) {
  const p = findRange(id).photos;
  const j = i + d;
  if (j < 0 || j >= p.length) return;
  [p[i], p[j]] = [p[j], p[i]];
  await save(); renderSettings();
}
async function delPhoto(id, i) {
  if (!confirm('이 사진을 삭제할까요?')) return;
  findRange(id).photos.splice(i, 1);
  await save(); renderSettings();
}
function pickPhotos(id) {
  addTarget = id;
  document.getElementById('photoFile').click();
}
document.getElementById('photoFile').addEventListener('change', async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length || addTarget === null) return;
  const r = findRange(addTarget);
  for (const f of files) {
    try { r.photos.push({ src: await resize(f) }); } catch (err) { alert('사진을 읽지 못했습니다'); }
  }
  await save(); renderSettings();
});

let openId = null;
function toggleRange(id) { openId = (openId === id) ? null : id; renderSettings(); }
function renderSettings() {
  const list = document.getElementById('rangeList');
  list.innerHTML = '';
  data.ranges.forEach(r => {
    const box = document.createElement('div');
    box.className = 'rangeBox';
    const open = openId === r.id;
    const thumb = r.photos.length ? `<img class="rangeThumb" src="${r.photos[0].src}">` : `<div class="rangeThumb"></div>`;
    let html = `<div class="rangeTitleRow" onclick="toggleRange(${r.id})">
      ${thumb}<b>${r.min} ~ ${r.max}℃</b><span>사진 ${r.photos.length}장 ${open ? '▲' : '▼'}</span></div>`;
    if (open) {
      html += `<div class="rangeHead">
        <span class="rangeEdit"><input type="number" inputmode="decimal" id="min${r.id}" value="${r.min}"> ~
        <input type="number" inputmode="decimal" id="max${r.id}" value="${r.max}"> ℃
        <button class="btn" onclick="editRange(${r.id})">변경</button></span>
        <button class="btn del" onclick="delRange(${r.id})">삭제</button></div>`;
      r.photos.forEach((p, i) => {
        html += `<div class="item"><img src="${p.src}"><span>${i + 1}번</span>
          <button class="btn" onclick="movePhoto(${r.id},${i},-1)">↑</button>
          <button class="btn" onclick="movePhoto(${r.id},${i},1)">↓</button>
          <button class="btn del" onclick="delPhoto(${r.id},${i})">✕</button></div>`;
      });
      html += `<button class="btn add" onclick="pickPhotos(${r.id})">＋ 사진 추가</button>`;
    }
    box.innerHTML = html;
    list.appendChild(box);
  });
}

// ===== 백업 =====
function exportData() {
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '자전거옷_백업.json';
  a.click();
}
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.ranges) throw 0;
    if (!confirm('현재 데이터를 백업 파일로 바꿀까요?')) return;
    data = d;
    await save();
    renderSettings();
    alert('불러오기 완료');
  } catch { alert('올바른 백업 파일이 아닙니다'); }
});

// ===== 날씨 (오늘·내일 최고·최저 + 체감) =====
function setTemp(v) { tIn.value = v; show(); window.scrollTo(0, 0); }
function wrow(cls, label, v, f) {
  return `<div class="wrow"><span class="chip ${cls}" onclick="setTemp(${v})">${label} ${v}°</span><br>
    <span class="feel" onclick="setTemp(${f})">(체감 ${f}°)</span></div>`;
}
function loadWeather() {
  const w = document.getElementById('weather');
  if (!navigator.geolocation) { w.innerHTML = '<div class="wmsg">위치 기능을 쓸 수 없습니다</div>'; return; }
  w.innerHTML = '<div class="wmsg">위치 확인 중…</div>';
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const { latitude: la, longitude: lo } = pos.coords;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min&timezone=auto&forecast_days=2`;
      const d = (await (await fetch(url)).json()).daily;
      const r = Math.round;
      const box = (i, name) => `<div class="wbox"><b>${name}</b>
        ${wrow('hi', '최고', r(d.temperature_2m_max[i]), r(d.apparent_temperature_max[i]))}
        ${wrow('lo', '최저', r(d.temperature_2m_min[i]), r(d.apparent_temperature_min[i]))}</div>`;
      w.innerHTML = box(0, '오늘') + box(1, '내일');
    } catch (e) {
      w.innerHTML = '<div class="wmsg">날씨를 가져오지 못했습니다 <span class="chip" onclick="loadWeather()">다시 시도</span></div>';
    }
  }, () => {
    w.innerHTML = '<div class="wmsg">위치 권한이 필요합니다 <span class="chip" onclick="loadWeather()">다시 시도</span></div>';
  }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 });
}

// ===== 시작 =====
(async () => {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  await openDB();
  await load();
  sortRanges();
  let last = null;
  try { last = localStorage.getItem('lastTemp'); } catch (e) {}
  tIn.value = (last !== null && last !== '') ? last : 10;
  show();
  loadWeather();
})();

// 시작 화면 1.5초 후 사라짐
setTimeout(() => {
  const sp = document.getElementById('splash');
  sp.classList.add('hide');
  setTimeout(() => sp.remove(), 500);
}, 1500);
</script>
</body>
</html>
