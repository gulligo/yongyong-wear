<script>
let db, data = { ranges: [] };
let addTarget = null;
const tIn = document.getElementById('temp');

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('bikeClothes', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('s');
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
function load() {
  return new Promise(res => {
    const r = db.transaction('s').objectStore('s').get('data');
    r.onsuccess = () => { if (r.result) data = r.result; res(); };
    r.onerror = () => res();
  });
}
function save() {
  return new Promise(res => {
    const t = db.transaction('s', 'readwrite');
    t.objectStore('s').put(data, 'data');
    t.oncomplete = res;
    t.onerror = () => { alert('저장 실패 (저장공간 부족일 수 있습니다)'); res(); };
  });
}

// 사진 줄이기 (용량 절약)
function resize(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const m = 1000;
      let w = img.width, h = img.height;
      if (w > m || h > m) { const s = m / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = rej;
    img.src = url;
  });
}

// ===== 메인 화면 =====
function step(d) {
  const v = parseFloat(tIn.value);
  tIn.value = (isNaN(v) ? 10 : v) + d;
  show();
}
tIn.addEventListener('input', show);

function show() {
  const box = document.getElementById('photos');
  const t = parseFloat(tIn.value);
  box.innerHTML = '';
  if (isNaN(t)) { box.innerHTML = '<div class="empty">온도를 입력하세요</div>'; return; }
  try { localStorage.setItem('lastTemp', t); } catch (e) {}
  const hits = data.ranges.filter(r => t >= r.min && t <= r.max).sort((a, b) => (b.max - a.max) || (b.min - a.min));
  if (!hits.length) {
    box.innerHTML = `<div class="empty">${t}℃ 에 맞는 구간이 없습니다.<br>⚙ 설정에서 구간을 추가하세요.</div>`;
    return;
  }
  hits.forEach(r => {
    const title = document.createElement('div');
    title.className = 'rangeTitle';
    title.textContent = `${r.min} ~ ${r.max}℃`;
    box.appendChild(title);
    if (!r.photos.length) {
      const e = document.createElement('div');
      e.className = 'empty'; e.textContent = '등록된 사진이 없습니다';
      box.appendChild(e);
    }
    r.photos.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'photo';
      d.innerHTML = `<img src="${p.src}"><div class="no">${i + 1}</div>`;
      let timer = null, longFired = false, sx = 0, sy = 0;
      const cancel = () => { clearTimeout(timer); timer = null; };
      d.addEventListener('pointerdown', e => {
        longFired = false; sx = e.clientX; sy = e.clientY;
        timer = setTimeout(() => { longFired = true; openMenu(r.id, i); }, 550);
      });
      d.addEventListener('pointermove', e => { if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) cancel(); });
      d.addEventListener('pointerup', cancel);
      d.addEventListener('pointercancel', cancel);
      d.addEventListener('contextmenu', e => e.preventDefault());
      d.onclick = () => {
        if (longFired) return;
        document.getElementById('viewImg').src = p.src;
        document.getElementById('viewer').style.display = 'flex';
      };
      box.appendChild(d);
    });
  });
}

// ===== 사진 길게 누르기 메뉴 =====
let menuR = null, menuI = 0;
function openMenu(id, i) { menuR = id; menuI = i; drawMenu(); document.getElementById('menu').style.display = 'flex'; }
function drawMenu() {

async function addRange() {
  const mn = parseFloat(document.getElementById('newMin').value);
  const mx = parseFloat(document.getElementById('newMax').value);
  if (isNaN(mn) || isNaN(mx)) return alert('두 온도를 모두 입력하세요');
  const lo = Math.min(mn, mx), hi = Math.max(mn, mx);
  if (data.ranges.some(r => r.min === lo && r.max === hi)) return alert(`${lo} ~ ${hi}℃ 구간은 이미 있습니다`);
  const id = Date.now();
  data.ranges.push({ id, min: lo, max: hi, photos: [] });
  editRanges.add(id);
  sortRanges();
  await save();
  document.getElementById('newMin').value = '';
  document.getElementById('newMax').value = '';
  renderSettings();
}
// 높은 온도 구간이 위로
function sortRanges() { data.ranges.sort((a, b) => (b.max - a.max) || (b.min - a.min)); }
function findRange(id) { return data.ranges.find(r => r.id === id); }

async function editRange(id) {
  const mn = parseFloat(document.getElementById('min' + id).value);

      h.textContent = g.title;

    const grid = document.createElement('div');
    grid.className = 'thumbs';
    g.items.forEach((it, ii) => {

      d.className = 'th ' + (it.on ? 'on' : 'off');

// 현재 날씨(초단기실황): 매시 정각 자료, 40분 이후 제공
function baseNow() { const d = new Date(Date.now() - 40 * 60000); return { date: ymd8(d), time: pad2(d.getHours()) + '00' }; }
function baseUltra() { const d = new Date(Date.now() - 45 * 60000); return { date: ymd8(d), time: pad2(d.getHours()) + '30' }; }
function baseVil() {
  const d = new Date(Date.now() - 10 * 60000);
  let h = [2, 5, 8, 11, 14, 17, 20, 23].filter(x => x <= d.getHours()).pop();
  if (h === undefined) { d.setDate(d.getDate() - 1); h = 23; }
  return { date: ymd8(d), time: pad2(h) + '00' };
}
// 오늘 최저·최고가 들어있는 예보: 오늘 새벽 2시 발표 (2시 10분 전이면 어제 23시)
function baseDay() {
  const d = new Date(Date.now() - 10 * 60000);
  if (d.getHours() >= 2) return { date: ymd8(d), time: '0200' };
  d.setDate(d.getDate() - 1);
  return { date: ymd8(d), time: '2300' };
}

// 날씨누리 하늘 글자 → 앱 기호 (SKY 1 맑음, 3 구름많음, 4 흐림 / PTY 비·눈 종류)
function skyFromText(t) {
  t = t || '';
  if (t.includes('진눈깨비') || (t.includes('빗방울') && t.includes('눈날림'))) return { PTY: 6 };
  if (t.includes('소나기')) return { PTY: 4 };
  if (t.includes('빗방울')) return { PTY: 5 };
  if (t.includes('눈날림')) return { PTY: 7 };
  if (t.includes('비') && t.includes('눈')) return { PTY: 2 };
  if (t.includes('눈')) return { PTY: 3 };
  if (t.includes('비')) return { PTY: 1 };
  if (t.includes('흐림')) return { PTY: 0, SKY: 4 };
  if (t.includes('구름')) return { PTY: 0, SKY: 3 };
  if (t.includes('맑음')) return { PTY: 0, SKY: 1 };
  return { PTY: 0 };
}

// 날씨누리 (Worker 통해서) — 날씨누리와 같은 숫자
async function loadNuri(p) {
  const r = await fetch(`${NURI}?code=${p.code}`);
  const j = await r.json();
  if (!j.ok || !j.hours || !j.hours.length) throw new Error(j.error || 'nuri');
  const out = { src: 'nuri', h: {}, tmx: {}, tmn: {}, popAt: null, now: null, nowAt: null, days: j.days || [] };
  j.hours.forEach(x => {
    const k = x.date.replace(/-/g, '') + x.time.replace(':', '');
    out.h[k] = { ...skyFromText(x.sky), TMP: x.tmp, FEEL: x.feel, POP: x.pop, WSD: x.wsd, WDIR: x.wdir, REH: x.reh, PCP: x.pcp };
  });
  out.days.forEach(d => {
    const k = d.date.replace(/-/g, '');
    if (d.tmin != null) out.tmn[k] = d.tmin;
    if (d.tmax != null) out.tmx[k] = d.tmax;
  });
  const t = j.issued && j.issued.short && j.issued.short.match(/(\d{2}):\d{2}/);
  if (t) out.popAt = t[1] + '00';
  if (j.now && j.now.tmp != null) {
    const n = j.now;
    out.now = { T1H: n.tmp, FEEL: n.feel, WSD: n.wsd || 0, WDIR: n.wdir, REH: n.reh, PTY: 0, RN1: n.rn1 && n.rn1 !== '-' ? n.rn1 : 0 };
    const a = (n.at || '').match(/(\d{2}):(\d{2})/);
    out.nowAtText = a ? `${+a[1]}:${a[2]}` : '';
    if (n.dust) out.dust = n.dust;
  }
  return out;
}

// CAMS 모델 시간별 예보 (Open-Meteo 대기질)
async function loadPmFc(p) {
  const r = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}&hourly=pm2_5,pm10&timezone=Asia%2FSeoul&forecast_days=4`);
  const j = await r.json();
  const fc = {};
  j.hourly.time.forEach((t, i) => {
    if (j.hourly.pm2_5[i] == null) return;
    fc[t.replace(/[-T:]/g, '')] = j.hourly.pm2_5[i];      // 키: YYYYMMDDHHMM
  });

}

// 지금 측정값과 모델 차이만큼 보정 (24시간에 걸쳐 보정을 줄임)
function pmForecast(w) {
  const fc = w.pmfc;
  if (!fc) return {};
  let off = 0, base = null;
  const d = w.dust;
  if (d && d.pm25 != null && d.at) {
    const m = d.at.match(/(\d{1,2})\.(\d{1,2})\.\s*\([^)]*\)\s*(\d{1,2}):/);
    if (m) {
      const now = new Date();
      base = new Date(now.getFullYear(), +m[1] - 1, +m[2], +m[3]);
      if (base - now > 86400000 * 30) base.setFullYear(base.getFullYear() - 1);
      const k = ymd8(base) + pad2(base.getHours()) + '00';
      if (fc[k] != null) off = d.pm25 - fc[k];
    }
  }
  const out = {};
  Object.keys(fc).forEach(k => {
    let v = fc[k];
    if (base && off) {
      const t = new Date(+k.substr(0, 4), +k.substr(4, 2) - 1, +k.substr(6, 2), +k.substr(8, 2));
      const hrs = (t - base) / 3600000;
      if (hrs >= 0) v += off * Math.max(0, 1 - hrs / 24);
    }
    out[k] = Math.max(0, Math.round(v));
  });
  return out;
}

async function loadPlaceWx(p) {
  try { return await loadNuri(p); } catch (e) { /* 날씨누리 실패 → 공개 API */ }
  const out = { src: 'api', h: {}, tmx: {}, tmn: {}, popAt: null, now: null, nowAt: null };
  const add = (items, ren) => items.forEach(i => {
    const k = i.fcstDate + i.fcstTime;
    (out.h[k] = out.h[k] || {})[ren[i.category] || i.category] = i.fcstValue;
    if (i.category === 'TMX') out.tmx[i.fcstDate] = +i.fcstValue;
    if (i.category === 'TMN') out.tmn[i.fcstDate] = +i.fcstValue;
  });
  const [a, b, c, n] = await Promise.allSettled([
    wxApi('getVilageFcst', baseDay(), p),
    wxApi('getVilageFcst', baseVil(), p),
    wxApi('getUltraSrtFcst', baseUltra(), p),
    wxApi('getUltraSrtNcst', baseNow(), p)
  ]);
  if (n.status === 'fulfilled') {
    out.now = {};
    n.value.forEach(i => out.now[i.category] = +i.obsrValue);
    out.nowAt = baseNow().time;
  }
  if (a.status === 'fulfilled') { add(a.value, {}); out.popAt = baseDay().time; }
  if (b.status === 'fulfilled') { add(b.value, {}); out.popAt = baseVil().time; }
  if (c.status === 'fulfilled') add(c.value, { T1H: 'TMP', RN1: 'PCP' });
  if (b.status !== 'fulfilled' && c.status !== 'fulfilled') throw new Error('fail');
  return out;
}

// 체감온도 (기상청 공식)
function chill(t, kmh) {
  if (t > 10 || kmh < 4.68) return t;
  const v = Math.pow(kmh, 0.16);
  return 13.12 + 0.6215 * t - 11.37 * v + 0.3965 * t * v;
}
function summer(t, rh) {
  const tw = t * Math.atan(0.151977 * Math.sqrt(rh + 8.313659)) + Math.atan(t + rh) - Math.atan(rh - 1.67633)
    + 0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh) - 4.686035;
  return -0.2442 + 0.55399 * tw + 0.45535 * t - 0.0022 * tw * tw + 0.00278 * tw * t + 3.0;
}
function feel(t, w, rh, mon) { return (mon >= 5 && mon <= 9 && t >= 20 && !isNaN(rh)) ? summer(t, rh) : chill(t, w * 3.6); }
function ride(t, w) { return chill(t, w * 3.6 + RIDE_KMH); }

const PTY = { 1: '🌧️', 2: '🌨️', 3: '❄️', 4: '🌦️', 5: '🌧️', 6: '🌨️', 7: '❄️' };

function wIcon(v, h) {
  if (+v.PTY > 0) return PTY[v.PTY] || '🌧️';
  if (+v.SKY === 1 && (h < 6 || h >= 19)) return '🌙';
  if (+v.SKY === 3 && (h < 6 || h >= 19)) return '<span class="nc">🌙☁️</span>';
  return SKY[v.SKY] || '';
}
// 가장 많이 나온 값 (같으면 더 흐린 쪽)
function mode(arr) {
  const c = {};
  arr.forEach(x => c[x] = (c[x] || 0) + 1);
  return +Object.keys(c).sort((a, b) => (c[b] - c[a]) || (b - a))[0];
}
function dirTx(d) { return ['북', '북동', '동', '남동', '남', '남서', '서', '북서'][Math.round(d / 45) % 8]; }
function pcpTx(v) { if (!v || v === '강수없음' || v === '0') return '-'; return String(v).replace('mm', ''); }

async function loadWx(force) {
  if (!force) {
    try {
      const c = JSON.parse(localStorage.getItem('wearWx3') || 'null');
      if (c) { WX = c.d; renderWx(new Date(c.at), !selKey); }
      if (c && Date.now() - c.at < 5 * 60000) return;
    } catch (e) {}
  }
  document.getElementById('wxAt').textContent = '불러오는 중...';
  try {
    WX = await Promise.all(PLACES.map(loadPlace));
    try { localStorage.setItem('wearWx3', JSON.stringify({ at: Date.now(), d: WX })); } catch (e) {}
    renderWx(new Date(), !selKey);
  } catch (e) {
    document.getElementById('wxAt').textContent = '날씨를 불러오지 못했습니다';
  }
}

function setPlace(i) {
  place = i;
  document.getElementById('tab0').classList.toggle('on', i === 0);
  document.getElementById('tab1').classList.toggle('on', i === 1);
  renderWx(null, false);
}

function hourList() {
  const now = new Date();
  const cur = ymd8(now) + pad2(now.getHours()) + '00';
  return [...new Set(WX.flatMap(w => Object.keys(w.h)))]
    .filter(k => k >= cur && WX.every(w => w.h[k] && w.h[k].TMP != null))
    .sort();
}
function info(k) {
  const vs = WX.map(w => w.h[k]);
  const mon = +k.substr(4, 2);
  return vs.map(v => {
    const t = +v.TMP, w = +v.WSD || 0, rh = +v.REH;
    return { v, t, w, rh, feel: v.FEEL != null ? +v.FEEL : feel(t, w, rh, mon), ride: ride(t, w), pop: v.POP != null ? +v.POP : null, pty: +v.PTY || 0 };
  });
}
const isBad = x => x.pty > 0 || (x.pop != null && x.pop >= POP_WARN) || x.w >= WIND_WARN;
const shiftK = (k, d) => {
  const t = new Date(+k.substr(0, 4), +k.substr(4, 2) - 1, +k.substr(6, 2), +k.substr(8, 2) + d);
  return ymd8(t) + pad2(t.getHours()) + '00';
};

function renderWx(at, autoPick) {
  if (!WX) return;
  if (at) {
    const src = WX.every(w => w.src === 'nuri') ? '날씨누리' : WX.some(w => w.src === 'nuri') ? '날씨누리·공개API' : '공개API (날씨누리 연결 안 됨)';
    document.getElementById('wxAt').textContent = `${pad2(at.getHours())}:${pad2(at.getMinutes())} ${src}`;
  }
  const now = new Date();
  const dayName = d8 => {
    const dd = new Date(+d8.substr(0, 4), +d8.substr(4, 2) - 1, +d8.substr(6, 2));
    const diff = Math.round((dd - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    return { lab: ['오늘', '내일', '모레', '글피'][diff] || '', txt: `${dd.getDate()}일(${'일월화수목금토'[dd.getDay()]})` };
  };
  const W = WX[place];
  const dustHtml = d => {
    if (!d || d.pm25 == null) return '';
    const g = pmGrade(d.pm25);
    return `<div class="dust"><span>초미세</span><span class="pmv">${d.pm25}</span><span class="gbd" style="background:${g.color}">${g.name}</span>${d.pm10 != null ? `<span>미세 ${d.pm10}</span>` : ''}</div>`;
  };
  const PMF = WX.map(pmForecast);
  // --- 지금 날씨 (두 곳) ---
  document.getElementById('wxNow').innerHTML = WX.map((w, i) => {
    const n = w.now;
    if (!n || n.T1H == null) return `<div class="pl ${i === place ? 'on' : ''}"><div class="nm">${PLACES[i].name} 지금</div><div class="tp">자료 없음</div></div>`;
    const f = n.FEEL != null ? n.FEEL : feel(n.T1H, n.WSD || 0, n.REH, now.getMonth() + 1);
    const nowAt = w.nowAtText || (w.nowAt ? +w.nowAt.substr(0, 2) + '시' : '');
    const rain = n.PTY > 0 ? ` · ${PTYT[n.PTY]}${n.RN1 ? ' ' + n.RN1 + 'mm' : ''}` : '';
    return `<div class="pl ${i === place ? 'on' : ''}" onclick="setPlace(${i})">
      <div class="nm">${PLACES[i].name} 지금 (${nowAt})</div>
      <div class="fl">${f.toFixed(1)}°<span>체감</span></div>
      <div class="tp">기온 ${n.T1H.toFixed(1)}° · 바람 ${n.WDIR === null && !n.WSD ? '-' : (n.WDIR ? n.WDIR + ' ' : '') + n.WSD + 'm/s'}${rain}</div>${dustHtml(w.dust)}</div>`;
  }).join('');
  document.getElementById('popLab').innerHTML = W.popAt ? `강수확률<small>${+W.popAt.substr(0, 2)}시 발표</small>` : '강수확률';
  const keys = hourList();
  const infos = {}; keys.forEach(k => infos[k] = info(k));

  // --- 날짜별 요약 (오전/오후) ---
  const dates = [...new Set(Object.keys(W.h).map(k => k.substr(0, 8)))].sort().filter(d => d >= ymd8(now)).slice(0, 3);
  document.getElementById('days').innerHTML = dates.map(d => {
    const hs = Object.keys(W.h).filter(k => k.startsWith(d) && W.h[k].TMP != null);
    // 오전(0~11시)/오후(12~23시): 날씨누리처럼 지난 시간은 빼고,
    // 하늘은 가장 많이 나온 상태, 강수확률은 평균을 10% 단위로 반올림
    const cur = ymd8(now) + pad2(now.getHours()) + '00';
    // 날씨누리 자료가 있으면 날씨누리 요약을 그대로 사용
    const nd = (W.days || []).find(x => x.date.replace(/-/g, '') === d);
    const half = am => {
      if (nd) {
        const sky = am ? nd.amSky : nd.pmSky, pop = am ? nd.amPop : nd.pmPop;
        return { ic: sky ? wIcon(skyFromText(sky), am ? 9 : 15) : '-', pop: pop == null ? '-' : pop + '%' };
      }
      const ks = hs.filter(k => (am ? +k.substr(8, 2) < 12 : +k.substr(8, 2) >= 12) && k >= cur);
      if (!ks.length) return { ic: '-', pop: '-' };
      const rain = ks.map(k => +W.h[k].PTY || 0).filter(x => x > 0);
      let v;
      if (rain.length) v = { PTY: mode(rain) };
      else v = { PTY: 0, SKY: mode(ks.map(k => +W.h[k].SKY).filter(x => !isNaN(x))) };
      const pops = ks.map(k => +W.h[k].POP).filter(x => !isNaN(x));
      const avg = pops.length ? Math.round(pops.reduce((a, b) => a + b, 0) / pops.length / 10) * 10 : null;
      return { ic: wIcon(v, am ? 9 : 15), pop: avg == null ? '-' : avg + '%' };
    };
    const temps = hs.map(k => +W.h[k].TMP);
    const lo = W.tmn[d] != null ? W.tmn[d] : temps.length ? Math.min(...temps) : null;
    const hi = W.tmx[d] != null ? W.tmx[d] : temps.length ? Math.max(...temps) : null;
    const a = half(true), p = half(false), n = dayName(d);
    return `<div class="dayc"><div class="dn">${n.txt}<span>${n.lab}</span></div>
      <div class="am"><span>오전</span><span>오후</span></div>
      <div class="ic"><span>${a.ic}</span><span>${p.ic}</span></div>
      <div class="mm"><span class="lo">${lo == null ? '-' : Math.round(lo) + '°'}</span><span class="hi">${hi == null ? '-' : Math.round(hi) + '°'}</span></div>
      <div class="pp"><span>${a.pop}</span><span>${p.pop}</span></div></div>`;
  }).join('');

  // --- 출퇴근 경고 (두 곳 모두, 앞뒤 1시간) ---
  // ☂️ 비·눈·강풍 줄 / 😷 초미세먼지 줄 을 따로 짧게 표시
  const badC = {}, wxA = [], pmA = [];
  keys.filter(k => COMMUTE.includes(+k.substr(8, 2))).forEach(k => {
    const day = dayName(k.substr(0, 8)).lab, hr = +k.substr(8, 2);
    // 비·눈·강풍
    const around = [-1, 0, 1].map(d => infos[shiftK(k, d)]).filter(Boolean).flat();
    if (around.some(isBad)) {
      badC[k] = true;
      const what = [];
      const pty = around.map(x => x.pty).find(x => x > 0);
      const pop = Math.max(...around.map(x => x.pop || 0));
      if (pty) what.push(PTYT[pty]); else if (pop >= POP_WARN) what.push(`비 ${pop}%`);
      const w = Math.max(...around.map(x => x.w));
      if (w >= WIND_WARN) what.push(`바람 ${w}m/s`);
      if (what.length) wxA.push({ day, hr, what: what.join(', ') });
    }
    // 초미세먼지: 두 곳 중 더 나쁜 쪽, 등급이 다르면 지역 이름 붙임
    const vals = PMF.map(f => f[k]);
    const ok = vals.filter(v => v != null);
    if (ok.length) {
      const mx = Math.max(...ok);
      if (mx >= PM_WARN) {
        badC[k] = true;
        const g = pmGrade(mx).name;
        const grades = vals.map(v => v == null ? null : pmGrade(v).name);
        const who = grades.filter(x => x).every(x => x === g) ? '' : `(${PLACES[vals.indexOf(mx)].name.replace(/동$/, '')})`;
        pmA.push({ day, hr, txt: g + who });
      }
    }
  });
  // 같은 날·같은 내용 묶기: '모레 6·14·18시 비'
  const wxG = [];
  wxA.forEach(a => {
    const g = wxG.find(x => x.day === a.day && x.what === a.what);
    g ? g.hrs.push(a.hr) : wxG.push({ day: a.day, what: a.what, hrs: [a.hr] });
  });
  // 미세먼지: 날짜별로 한 번만, 시간마다 등급 (연달아 같은 등급은 묶기)
  const pmG = [];
  pmA.forEach(a => {
    let d = pmG.find(x => x.day === a.day);
    if (!d) pmG.push(d = { day: a.day, parts: [] });
    const last = d.parts[d.parts.length - 1];
    last && last.txt === a.txt ? last.hrs.push(a.hr) : d.parts.push({ txt: a.txt, hrs: [a.hr] });
  });
  const lines = [];
  if (wxG.length) lines.push('☂️ ' + wxG.map(g => `${g.day} ${g.hrs.join('·')}시 ${g.what}`).join(' / '));
  if (pmG.length) lines.push('😷 ' + pmG.map(d => d.day + ' ' + d.parts.map(p => `${p.hrs.join('·')}시 ${p.txt}`).join(' · ')).join(' / '));
  const al = document.getElementById('wxAlert');
  al.className = lines.length ? 'bad' : 'good';
  al.innerHTML = lines.length ? lines.map(l => `<div>${l}</div>`).join('') : '👍 모레까지 출퇴근 시간 비·강풍·미세먼지 걱정 없음';

  // --- 시간별 ---
  let lastD = '';
  const grid = document.getElementById('hgrid');
  grid.innerHTML = keys.map(k => {
    const x = infos[k][place], hr = +k.substr(8, 2), d = k.substr(0, 8);
    const date = d !== lastD ? `<span class="badge">${dayName(d).txt}</span>` : '';
    lastD = d;
    const cm = COMMUTE.includes(hr);
    const cls = [cm ? 'cm' : '', (cm && badC[k]) || isBad(x) ? 'bad' : '', k === selKey ? 'sel' : ''].join(' ');
    const vec = +x.v.VEC;
    const pmv = PMF[place][k];
    return `<div class="hcol ${cls}" data-k="${k}" onclick="pickHour('${k}')">
      <div class="r-date">${date}</div>
      <div class="r-time">${hr}시</div>
      <div class="r-ic">${wIcon(x.v, hr)}</div>
      <div class="r-gr"></div>
      <div class="r-fl">${Math.round(x.feel)}°</div>
      <div class="r-pop">${x.pop == null ? '' : x.pop + '%'}</div>
      <div class="r-pcp">${pcpTx(x.v.PCP)}</div>
      <div class="r-wd ${x.w >= WIND_WARN ? 'strong' : ''}">${x.v.WDIR === null ? '<span>-</span>' : `<span>${x.v.WDIR ? x.v.WDIR.replace(/풍$/, '') : isNaN(vec) ? '' : dirTx(vec)}</span><span>${x.w}m/s</span>`}</div>
      <div class="r-pm">${pmv == null ? '-' : `<b style="background:${pmGrade(pmv).color}">${pmv}</b><small>${pmGrade(pmv).name}</small>`}</div>
    </div>`;
  }).join('');

  document.getElementById('pmLg').innerHTML = PMF[place] && Object.keys(PMF[place]).length
    ? PM8.map((g, i) => `<span style="background:${g[2]}">${g[1]} ${i ? PM8[i - 1][0] + 1 : 0}${g[0] === Infinity ? '~' : '~' + g[0]}</span>`).join('') : '';

  // --- 기온 꺾은선 그래프 ---
  const temps = keys.map(k => infos[k][place].t);
  if (temps.length) {
    const mx = Math.max(...temps), mn = Math.min(...temps), span = Math.max(mx - mn, 1);
    const top = 22 + 24 + 34, H = 64;
    const pts = temps.map((t, i) => [i * COL_W + COL_W / 2, top + 18 + (mx - t) / span * (H - 26)]);
    const svg = `<svg id="hsvg" width="${keys.length * COL_W}" height="${top + H}" style="top:0">
      <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#2b8de0" stroke-width="2.5"/>
      ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#2b8de0"/>
        <text x="${p[0]}" y="${p[1] - 8}" text-anchor="middle" font-size="13" fill="#222">${Math.round(temps[i])}°</text>`).join('')}
    </svg>`;
    grid.insertAdjacentHTML('beforeend', svg);
  }

  // --- 처음엔 다음 출퇴근 시간 자동 선택 (두 곳 중 더 추운 쪽) ---
  if (autoPick || !selKey || !infos[selKey]) {
    const next = keys.find(k => COMMUTE.includes(+k.substr(8, 2)) && k > keys[0]) || keys[0];
    if (next) pickHour(next, true);
  } else {
    showAuto(selKey, false);
  }
}

function pickHour(k, auto) {
  selKey = k;
  document.querySelectorAll('.hcol').forEach(c => c.classList.toggle('sel', c.dataset.k === k));
  showAuto(k, auto);
  if (auto) {
    const col = document.querySelector(`.hcol[data-k="${k}"]`);
    if (col) document.getElementById('hscroll').scrollLeft = Math.max(0, col.offsetLeft - COL_W * 2);
  }
  updCurDate();
}
function showAuto(k, colder) {
  const xs = info(k);
  let i = place;
  if (colder) i = xs[0].feel <= xs[1].feel ? 0 : 1;
  const t = Math.round(xs[i].feel);
  const d = new Date(+k.substr(0, 4), +k.substr(4, 2) - 1, +k.substr(6, 2));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const lab = ['오늘', '내일', '모레'][Math.round((d - today) / 86400000)] || '';
  document.getElementById('autoInfo').textContent =
    `👕 ${lab} ${+k.substr(8, 2)}시 ${PLACES[i].name} 체감 ${t}° 기준${colder ? ' (두 곳 중 더 추운 쪽)' : ''}`;
  tIn.value = t;
  show();
}

// ===== 시작 =====
(async () => {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  await openDB();
  await load();
  sortRanges();
  let last = null;
  try { last = localStorage.getItem('lastTemp'); } catch (e) {}
  tIn.value = (last !== null && last !== '') ? last : 10;
  show();
  loadWx(false);
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadWx(false); });
// 앱을 켜둔 상태에서도 5분마다 새로 받아오기
setInterval(() => { if (!document.hidden) loadWx(true); }, 5 * 60000);
// 옆으로 넘길 때 왼쪽에 지금 보이는 날짜 표시
function updCurDate() {
  const cols = document.querySelectorAll('.hcol');
  const c = cols[Math.min(cols.length - 1, Math.floor(document.getElementById('hscroll').scrollLeft / COL_W))];
  if (!c) return;
  const k = c.dataset.k;
  document.getElementById('curDate').textContent = `${+k.substr(6, 2)}일`;
}
document.getElementById('hscroll').addEventListener('scroll', updCurDate);

// ===== 비구름 보기 (날씨누리 레이더 화면: 지난 시간 + 앞으로 약 2시간 예측) =====
// 펼칠 때만 불러오고, 접으면 비워서 데이터·배터리 아낌
function toggleRadar() {
  const body = document.getElementById('rdrBody'), fr = document.getElementById('rdrFrame');
  const open = body.style.display !== 'block';
  body.style.display = open ? 'block' : 'none';
  document.getElementById('rdrArrow').textContent = open ? '▲' : '▼';
  fr.src = open ? 'https://www.weather.go.kr/w/weather/radar/rain.do' : 'about:blank';
  if (open) setTimeout(() => document.getElementById('rdr').scrollIntoView({ behavior: 'smooth' }), 100);
}

// 시작 화면 1.5초 후 사라짐
setTimeout(() => {
  const sp = document.getElementById('splash');
  sp.classList.add('hide');
  setTimeout(() => sp.remove(), 500);
}, 1500);
</script>
